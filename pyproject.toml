[project]
name = "pigpose"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13.0",
    "lightning>=2.6.1",
    "numpy>=2.3.5",
    "opencv-python>=4.13.0.92",
    "peft>=0.19.1",
    "pillow>=12.0.0",
    "tensorboard>=2.20.0",
    "timm>=1.0.26",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "ultralytics>=8.4.46",
    "xformers==0.0.35",
]

[tool.uv.sources]
xformers = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
